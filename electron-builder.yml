appId: com.zhd2.mediaplayer
productName: ZHD2 Media Player
copyright: Copyright © 2026 ZHD2 Project
directories:
  output: release
  buildResources: electron
files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - package.json
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: portable
      arch:
        - x64
        - arm64
  artifactName: ZHD2-${version}-${arch}.${ext}
portable:
  artifactName: ZHD2-${version}-${arch}.exe
